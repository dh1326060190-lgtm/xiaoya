<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#C98736">
<title>小芽 · 宝妈孩子学习与成长管理工作台</title>
<link rel="stylesheet" href="css/styles.css">
<script>
  // Self-removing loading screen: removed as soon as body is parsed,
  // AND removed after 4s regardless (in case init() throws)
  window.addEventListener('error', function (e) {
    var el = document.getElementById('bootErr');
    if (el) {
      el.style.display = 'block';
      el.textContent = '页面初始化失败：' + (e.message || e.error || '未知错误') + '\n请尝试下拉刷新或在浏览器中切换至极速模式 / 标准模式后重新打开。';
    }
  });
  setTimeout(function () {
    var ld = document.getElementById('bootLoading');
    if (ld) ld.style.display = 'none';
  }, 4000);
</script>
</head>
<body>
  <div id="app"><div class="phone"><div class="view" id="bootLoading" style="display:flex;align-items:center;justify-content:center;color:#A8967E;font-size:14px;">小芽正在发芽…</div></div></div>
  <div id="bootErr" style="display:none;position:fixed;left:16px;right:16px;top:80px;background:#FBE9E3;color:#7A3A2E;border:1px solid #C76B57;border-radius:12px;padding:16px;font-size:13px;line-height:1.7;z-index:9999;white-space:pre-wrap;"></div>
  <script src="js/sprite.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
